name: Budget
options:
  bundleIdPrefix: com.personal
packages:
  BudgetCore:
    path: .
targets:
  Budget:
    type: application
    platform: macOS
    deploymentTarget: "26.0"
    sources: [App]
    dependencies:
      - package: BudgetCore
    info:
      path: App/Info.plist
      properties:
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.personal.budget.account-reference
            UTTypeDescription: Budget account reference
            UTTypeConformsTo: [public.data]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.personal.budget
        MARKETING_VERSION: "0.2.0"
        # Bump on icon changes: macOS caches app icons per bundle id + version.
        CURRENT_PROJECT_VERSION: "2"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
