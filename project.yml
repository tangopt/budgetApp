name: Mango
options:
  bundleIdPrefix: ubberninja
packages:
  BudgetCore:
    path: .
targets:
  Mango:
    type: application
    platform: macOS
    deploymentTarget: "26.0"
    sources: [App]
    dependencies:
      - package: BudgetCore
        product: BudgetCore
      - package: BudgetCore
        product: MangoSync
    # Signing (build step 0): Config/Signing.xcconfig includes the uncommitted Signing.local.xcconfig.
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    info:
      path: App/Info.plist
      properties:
        # CloudKit sharing (the household's share sheet), as on the iPhone.
        CKSharingSupported: true
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.personal.budget.account-reference
            UTTypeDescription: Mango account reference
            UTTypeConformsTo: [public.data]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ubberninja.mango
        PRODUCT_NAME: Mango
        MARKETING_VERSION: "0.2.0"
        # Bump on icon changes: macOS caches app icons per bundle id + version.
        CURRENT_PROJECT_VERSION: "4"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        # Read by App/Mango.entitlements (only used when a team is configured).
        Debug:
          CLOUDKIT_ENVIRONMENT: Development
        Release:
          CLOUDKIT_ENVIRONMENT: Production
  # The read-only iPhone app (build step 4).
  MangoPhone:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Phone
        excludes: ["Fonts/**"]
      # The bundled typefaces (step 16) as one folder, Mango.app/Fonts/<Family>/ with each family's OFL.txt beside
      # its files; BundledFonts.register() registers them at launch.
      - path: Phone/Fonts
        type: folder
        buildPhase: resources
    dependencies:
      - package: BudgetCore
        product: BudgetCore
      - package: BudgetCore
        product: MangoSync
      - package: BudgetCore
        product: MangoUI
      # The demo database: "Try with demo data" (Phone/Demo/PhoneDemoData.swift, every build) and the snapshot
      # harness (Phone/Snapshots/PhoneSnapshotRunner.swift, SNAPSHOTS only).
      - package: BudgetCore
        product: BudgetDemo
      # The widgets (step 7b Task 7), embedded in the app.
      - target: MangoWidgets
    # Includes the same uncommitted Signing.local.xcconfig, then the phone's entitlements (Phone/Mango.entitlements).
    configFiles:
      Debug: Config/SigningPhone.xcconfig
      Release: Config/SigningPhone.xcconfig
    info:
      path: Phone/Info.plist
      properties:
        NSFaceIDUsageDescription: Mango unlocks with Face ID so only you see the household's figures.
        # Settings ▸ About reads them.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # "YES" only in a team-signed build (Config/SigningPhone.xcconfig); read by CloudKitAvailability.
        MangoCloudKit: $(MANGO_CLOUDKIT)
        UILaunchScreen: {}
        # The household invitation (a CKShare link) opens this app and reaches the scene delegate (step 7a).
        CKSharingSupported: true
        # The widget's link (step 7b): mango://home, mango://month (WidgetLink).
        CFBundleURLTypes:
          - CFBundleURLName: ubberninja.mango.ios.widget
            CFBundleURLSchemes: [mango]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # Export compliance: only Apple's own encryption (CryptoKit), so TestFlight doesn't ask on every build.
        ITSAppUsesNonExemptEncryption: false
        # A PDF shared to Mango (step 10, Task 5: More… ▸ Mango from Safari or another app) arrives as a copy in
        # Documents/Inbox and goes into the iPad's Downloads tray (PhoneBrowser.receiveShared).
        CFBundleDocumentTypes:
          - CFBundleTypeName: PDF
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.adobe.pdf]
        LSSupportsOpeningDocumentsInPlace: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ubberninja.mango.ios
        PRODUCT_NAME: Mango
        MARKETING_VERSION: "0.2.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        # Read by Phone/Mango.entitlements (only used when a team is configured).
        Debug:
          CLOUDKIT_ENVIRONMENT: Development
        Release:
          CLOUDKIT_ENVIRONMENT: Production
  # The widgets (step 7b Task 7): net worth, left this pay month, payday on the lock screen. Read the App Group's snapshot.
  MangoWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.0"
    sources: [Widgets]
    dependencies:
      - package: BudgetCore
        product: BudgetCore
      - package: BudgetCore
        product: MangoUI
    configFiles:
      Debug: Config/SigningWidgets.xcconfig
      Release: Config/SigningWidgets.xcconfig
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Mango
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ubberninja.mango.ios.widgets
        PRODUCT_NAME: MangoWidgets
        MARKETING_VERSION: "0.2.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
