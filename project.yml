name: Mango
options:
  bundleIdPrefix: ubberninja
packages:
  BudgetCore:
    path: .
targets:
  Mango:
    type: application
    platform: macOS
    deploymentTarget: "26.0"
    sources: [App]
    dependencies:
      - package: BudgetCore
    # Signing (build step 0): Config/Signing.xcconfig includes the uncommitted Signing.local.xcconfig.
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    info:
      path: App/Info.plist
      properties:
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.personal.budget.account-reference
            UTTypeDescription: Mango account reference
            UTTypeConformsTo: [public.data]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ubberninja.mango
        PRODUCT_NAME: Mango
        MARKETING_VERSION: "0.2.0"
        # Bump on icon changes: macOS caches app icons per bundle id + version.
        CURRENT_PROJECT_VERSION: "4"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        # Read by App/Mango.entitlements (only used when a team is configured).
        Debug:
          CLOUDKIT_ENVIRONMENT: Development
        Release:
          CLOUDKIT_ENVIRONMENT: Production
