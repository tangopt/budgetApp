<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Example Utility: sign in</title></head>
<body>
  <!-- A local fixture: a sign-in form and links to a PDF and a non-PDF. No real site. -->
  <form method="post" action="/download">
    <label>Customer number <input name="username" autocomplete="username"></label>
    <label>Password <input name="password" type="password" autocomplete="current-password"></label>
    <button type="submit">Sign in</button>
  </form>
  <p><a href="bill.pdf" download>Latest bill (PDF)</a></p>
  <p><a href="notpdf.pdf" download>Broken bill</a></p>
</body>
</html>
