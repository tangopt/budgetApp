<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Mango app icon, master artwork (spec: docs/superpowers/specs/2026-10-22-companion-apps-overview.md §2.4).
       Original vector drawing in the style of the user's reference (2026-10-22): a glossy upright mango leaning
       right, a curved brown stem and one broad leaf falling to the right. Unmasked square: the system applies
       the rounded shape. Each top-level group is one Icon Composer layer. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16406A"/>
      <stop offset="1" stop-color="#0A2440"/>
    </linearGradient>
    <radialGradient id="fruit" cx="0.36" cy="0.32" r="0.78">
      <stop offset="0" stop-color="#FFE477"/>
      <stop offset="0.38" stop-color="#FFC838"/>
      <stop offset="0.72" stop-color="#F9A21E"/>
      <stop offset="1" stop-color="#E8741A"/>
    </radialGradient>
    <radialGradient id="rim" cx="0.75" cy="0.85" r="0.45">
      <stop offset="0" stop-color="#D9621A" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#D9621A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8ED257"/>
      <stop offset="1" stop-color="#3F9A2F"/>
    </linearGradient>
    <clipPath id="fruitClip">
      <path d="M585 300C720 300 800 400 790 540C780 680 700 790 580 840C470 885 330 880 270 820C220 770 230 700 290 650C350 600 360 560 370 500C385 380 460 300 585 300Z"/>
    </clipPath>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="20"/></filter>
    <filter id="softer" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="8"/></filter>
  </defs>
  <g id="background"><rect width="1024" height="1024" fill="url(#bg)"/></g>
  <g id="shadow" transform="translate(-48 12)"><ellipse cx="530" cy="880" rx="270" ry="40" fill="#000000" opacity="0.35" filter="url(#soft)"/></g>
  <g id="fruit" transform="translate(-48 12)"><path d="M585 300C720 300 800 400 790 540C780 680 700 790 580 840C470 885 330 880 270 820C220 770 230 700 290 650C350 600 360 560 370 500C385 380 460 300 585 300Z" fill="url(#fruit)"/></g>
  <g id="shading" transform="translate(-48 12)" clip-path="url(#fruitClip)">
    <ellipse cx="700" cy="760" rx="300" ry="240" fill="url(#rim)"/>
    <ellipse cx="660" cy="370" rx="120" ry="60" fill="#C9661A" opacity="0.35" filter="url(#soft)"/>
  </g>
  <g id="highlight" transform="translate(-48 12)" clip-path="url(#fruitClip)">
    <path d="M430 420C470 360 540 340 580 350C520 380 470 450 440 540C420 600 380 640 360 640C370 560 390 480 430 420Z" fill="#FFFFFF" opacity="0.42" filter="url(#softer)"/>
    <ellipse cx="560" cy="372" rx="22" ry="14" fill="#FFFFFF" opacity="0.7" filter="url(#softer)"/>
  </g>
  <g id="stem" transform="translate(-48 12)">
    <path d="M588 306C584 250 562 204 516 170" stroke="#7A4A22" stroke-width="28" stroke-linecap="round" fill="none"/>
    <path d="M578 290C574 248 556 214 524 186" stroke="#B07A45" stroke-width="7" stroke-linecap="round" fill="none" opacity="0.8"/>
  </g>
  <g id="leaf" transform="translate(-48 12)">
    <path d="M592 270C680 214 800 246 846 358C872 428 862 508 846 562C800 502 722 470 662 420C616 382 596 324 592 270Z" fill="url(#leaf)"/>
    <path d="M604 276C704 300 800 420 842 548" stroke="#D3F0AE" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.85"/>
    <g stroke="#D3F0AE" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.55">
      <path d="M680 306C710 282 740 270 772 268"/>
      <path d="M736 360C770 336 800 326 830 330"/>
      <path d="M782 432C808 412 830 404 852 404"/>
      <path d="M690 334C680 364 676 386 678 404"/>
      <path d="M752 404C740 430 736 452 738 470"/>
    </g>
  </g>
</svg>
